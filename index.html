<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#121213" />
  <title>Astro's Creator Wordle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Astro's Creator Wordle</h1>
      <button id="new-game" type="button">New game</button>
    </header>

    <p class="instructions">Guess a creator from the roster in six tries. Letters and periods count.</p>
    <section id="board" class="board" aria-label="Game board"></section>
    <p id="message" class="message" role="status" aria-live="polite"></p>

    <section id="keyboard" class="keyboard" aria-label="On-screen keyboard">
      <div class="keyboard-row">
        <button data-key="Q" type="button">Q</button><button data-key="W" type="button">W</button><button data-key="E" type="button">E</button>
        <button data-key="R" type="button">R</button><button data-key="T" type="button">T</button><button data-key="Y" type="button">Y</button>
        <button data-key="U" type="button">U</button><button data-key="I" type="button">I</button><button data-key="O" type="button">O</button>
        <button data-key="P" type="button">P</button>
      </div>
      <div class="keyboard-row">
        <span class="spacer"></span>
        <button data-key="A" type="button">A</button><button data-key="S" type="button">S</button><button data-key="D" type="button">D</button>
        <button data-key="F" type="button">F</button><button data-key="G" type="button">G</button><button data-key="H" type="button">H</button>
        <button data-key="J" type="button">J</button><button data-key="K" type="button">K</button><button data-key="L" type="button">L</button>
        <span class="spacer"></span>
      </div>
      <div class="keyboard-row">
        <button class="wide" data-key="ENTER" type="button">Enter</button>
        <button data-key="Z" type="button">Z</button><button data-key="X" type="button">X</button><button data-key="C" type="button">C</button>
        <button data-key="V" type="button">V</button><button data-key="B" type="button">B</button><button data-key="N" type="button">N</button>
        <button data-key="M" type="button">M</button><button class="symbol" data-key="." type="button">.</button>
        <button class="wide" data-key="BACKSPACE" type="button">⌫</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
